<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="description" content="软考中级软件设计师零基础备考助手"><link rel="manifest" href="manifest.webmanifest"><title>软考通 · 2027</title><style>
:root{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#15243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#1d4ed8,#558cf4);color:white;padding:28px 20px 24px;border-radius:0 0 24px 24px}h1{font-size:24px;margin:0 0 8px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:12px 0}p{line-height:1.7}small,.muted{color:#66758c}header small{color:#dce8ff}.wrap{max-width:720px;margin:auto;padding:18px 16px 100px}.card{background:#fff;border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #173c7310}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#edf4ff;padding:13px;border-radius:12px}.stat strong{font-size:23px;color:#1d4ed8;display:block}button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#2563eb;color:white;cursor:pointer}button.secondary{background:#e9f0ff;color:#1d4ed8}button.ghost{background:#f2f5fa;color:#293a52}button:disabled{opacity:.55}button.full{width:100%;margin-top:10px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 3px max(9px,env(safe-area-inset-bottom));box-shadow:0 -2px 16px #18305018;z-index:5}nav button{background:none;color:#6d7890;padding:7px 4px;font-size:12px;min-width:53px}nav button.active{color:#1d4ed8;font-weight:700}.choice{display:block;width:100%;text-align:left;background:#f3f6fb;color:#1d2c42;margin:9px 0;border:2px solid transparent}.choice.selected{border-color:#2563eb;background:#e8f0ff}.choice.correct{border-color:#16a34a;background:#e7f8ed}.choice.wrong{border-color:#ef4444;background:#fff0f0}.tag{display:inline-block;background:#e9f0ff;color:#2358bd;padding:5px 9px;border-radius:20px;font-size:12px;margin:3px}.progress{height:10px;background:#e7edf6;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#3b82f6}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.lesson{white-space:pre-line;line-height:1.9}.note{background:#fff8e6;border-radius:12px;padding:12px;font-size:13px;color:#775716}textarea,input{width:100%;border:1px solid #d9e2ef;border-radius:12px;padding:12px;font:inherit}textarea{min-height:80px}ul{padding-left:20px;line-height:1.9}.empty{text-align:center;padding:24px;color:#7b8798}footer{text-align:center;color:#8a96a7;font-size:12px;padding:10px}a{color:#2563eb}</style></head><body><header><h1>📘 软考通 · 2027</h1><small>中级软件设计师 · 零基础学习版</small></header><main class="wrap" id="app"></main><nav id="nav"></nav><script>
const chapters=[{id:'basic',name:'计算机系统基础',intro:'认识计算机的组成、CPU、存储器和数据表示。',lesson:'计算机硬件主要由运算器、控制器、存储器、输入设备和输出设备组成。\n\nCPU 通常包括运算器、控制器和寄存器。运算器负责算术与逻辑运算，控制器协调指令执行。\n\n存储层次：寄存器、Cache、主存、外存。通常越靠近 CPU，访问越快、容量越小、单位成本越高。\n\n二进制：每一位只有 0 或 1。1 字节（Byte）= 8 位（bit）。',questions:[{q:'CPU 中负责算术和逻辑运算的部件是？',options:['运算器','输入设备','外存','显示器'],a:0,why:'运算器执行加减、比较及逻辑运算。'},{q:'1 字节等于多少位？',options:['2 位','4 位','8 位','16 位'],a:2,why:'1 Byte = 8 bit。'},{q:'下列哪种存储器通常访问速度最快？',options:['机械硬盘','主存','寄存器','光盘'],a:2,why:'寄存器位于 CPU 内部，通常访问最快。'}]},{id:'os',name:'操作系统',intro:'进程、线程、调度、死锁与内存管理。',lesson:'操作系统管理硬件资源，并为应用提供运行环境。\n\n进程是资源分配的基本单位，线程是 CPU 调度的基本单位（常见操作系统模型）。同一进程内线程通常共享进程地址空间。\n\n死锁常见的四个必要条件：互斥、请求与保持、不可剥夺、循环等待。破坏其中任意一个必要条件即可防止死锁。',questions:[{q:'下列哪项不是死锁的必要条件？',options:['互斥','循环等待','请求与保持','一定有网络连接'],a:3,why:'网络连接并非死锁的必要条件。'},{q:'在常见线程模型中，CPU 调度的基本单位是？',options:['文件','线程','磁盘','目录'],a:1,why:'线程通常是 CPU 调度的基本单位。'}]},{id:'data',name:'数据结构与算法',intro:'数组、链表、栈、队列与时间复杂度。',lesson:'数据结构研究数据的逻辑关系、存储结构和基本操作。\n\n栈遵循后进先出（LIFO），队列遵循先进先出（FIFO）。\n\n顺序查找最坏时间复杂度为 O(n)；有序数组的二分查找最坏时间复杂度为 O(log n)。\n\n学习算法时先画图，再手动模拟操作过程。',questions:[{q:'栈的特点是？',options:['先进先出','后进先出','随机出入','只能存整数'],a:1,why:'栈 LIFO：最后入栈的元素最先出栈。'},{q:'有序数组二分查找的最坏时间复杂度通常是？',options:['O(1)','O(log n)','O(n²)','O(2ⁿ)'],a:1,why:'每次将搜索区间约缩小一半。'}]},{id:'db',name:'数据库基础',intro:'关系数据库、主键、SQL 查询。',lesson:'关系数据库使用表来组织数据。行可以表示一条记录，列表示字段。\n\n主键用于唯一标识一条记录，不允许重复，也不能为 NULL。\n\nSQL 示例：SELECT name FROM students WHERE score >= 60;\n\nWHERE 用于筛选记录，ORDER BY 用于排序，GROUP BY 用于分组。',questions:[{q:'SQL 中用于筛选记录的子句是？',options:['WHERE','ORDER BY','FROM','INSERT'],a:0,why:'WHERE 指定查询过滤条件。'},{q:'关系表的主键必须满足什么要求？',options:['可以重复','必须为空','唯一且非空','只能是姓名'],a:2,why:'主键约束要求唯一且非空。'}]},{id:'se',name:'软件工程与设计',intro:'开发过程、需求、测试与面向对象。',lesson:'软件开发常见阶段：需求分析、设计、编码、测试、维护。\n\n单元测试关注最小可测试单元；集成测试关注模块间接口与协作。\n\n面向对象的常见概念包括封装、继承和多态。\n\n设计模式是可复用的设计经验，不是可以不加思考直接套用的代码。',questions:[{q:'单元测试主要针对？',options:['整个组织','最小可测试单元','所有外部用户','服务器机房'],a:1,why:'单元测试关注函数、方法、类等可测试单元。'},{q:'以下哪项属于面向对象的典型特性？',options:['多态','硬盘分区','网络带宽','磁盘碎片'],a:0,why:'封装、继承、多态是面向对象常见特性。'}]}];
const all=chapters.flatMap(c=>c.questions.map((q,i)=>({...q,id:c.id+'-'+i,chapter:c.name})));const KEY='ruankao-pwa-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state={answers:[],wrong:[],completed:[],checks:[],...state};let page='home',chapter=chapters[0],quiz=[],idx=0,selected=null,mode='practice',results=[],started=0,timer=null;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),date=()=>new Date().toLocaleDateString('sv-SE'),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function stats(){let n=state.answers.length,k=state.answers.filter(x=>x.ok).length;return {n,k,rate:n?Math.round(k/n*100):0}}function card(s){return `<section class="card">${s}</section>`}function go(p){clearInterval(timer);page=p;render();window.scrollTo(0,0)}function render(){let n=$('nav');n.innerHTML=[['home','🏠','首页'],['learn','📖','学习'],['practice','✍️','刷题'],['plan','📅','计划'],['more','📊','我的']].map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${ic}<br>${t}</button>`).join('');let s=stats(),html='';if(page==='home'){html=card(`<h2>你好，未来的软件设计师 👋</h2><p>今天从一个小知识点开始，积累到考试那天。</p><div class="grid"><div class="stat">累计答题<strong>${s.n}</strong></div><div class="stat">答题正确率<strong>${s.rate}%</strong></div><div class="stat">完成章节<strong>${state.completed.length}/${chapters.length}</strong></div><div class="stat">学习打卡<strong>${state.checks.length} 天</strong></div></div><button class="full" onclick="go('learn')">开始今日学习 →</button>`)+card(`<h2>今日任务</h2><p>① 阅读一个章节知识点<br>② 完成 5 道练习题<br>③ 复习错题并打卡</p><button class="secondary full" onclick="checkin()">${state.checks.includes(date())?'✓ 今天已打卡':'完成今日打卡'}</button>`)+card('<h2>备考提醒</h2><p class="muted">目标：2027 年上半年。具体考试与报名日期请以官方公告为准。</p>')}else if(page==='learn'){html='<h2>知识点学习</h2>'+chapters.map(c=>card(`<div class="row"><div><h3>${c.name}</h3><small>${c.intro}</small></div><span class="tag">${state.completed.includes(c.id)?'已学':'待学'}</span></div><button class="secondary full" onclick="openLesson('${c.id}')">阅读章节</button>`)).join('')}else if(page==='lesson'){html=card(`<button class="ghost" onclick="go('learn')">← 返回章节</button><h2 style="margin-top:16px">${chapter.name}</h2><div class="lesson">${escape(chapter.lesson)}</div><button class="full" onclick="completeLesson()">${state.completed.includes(chapter.id)?'✓ 已完成，继续刷题':'标记已学并练习'}</button>`)}else if(page==='practice'){html=card(`<h2>章节刷题</h2><p class="muted">先选章节，每题提交后可查看解析。</p>${chapters.map(c=>`<button class="choice" onclick="startPractice('${c.id}')">${c.name} · ${c.questions.length} 题 →</button>`).join('')}`)+card(`<h2>错题重练</h2><p>当前错题：${state.wrong.length} 道</p><button class="secondary full" onclick="startWrong()">开始重练</button>`)+card('<h2>模拟考试</h2><p>示例题限时模拟（15 分钟），用于测试流程，非官方真题或完整考试。</p><button class="full" onclick="startExam()">开始模拟考试</button>')}else if(page==='quiz'){let q=quiz[idx];if(!q){go('practice');return}let checked=selected!==null;html=card(`<div class="row"><span class="tag">${mode==='exam'?'模拟考试':mode==='wrong'?'错题重练':'章节练习'}</span><span id="clock" class="muted">${idx+1}/${quiz.length}</span></div><div class="progress" style="margin:12px 0 20px"><div style="width:${idx/quiz.length*100}%"></div></div><h2>${idx+1}. ${escape(q.q)}</h2>${q.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${checked&&mode!=='exam'&&i===q.a?'correct':''}" onclick="choose(${i})" ${checked?'disabled':''}>${'ABCD'[i]}. ${escape(o)}</button>`).join('')}${checked&&mode!=='exam'?`<p class="note">${selected===q.a?'回答正确！':'回答错误。'} 正确答案：${'ABCD'[q.a]}。${escape(q.why)}</p>`:''}<button class="full" onclick="nextQuestion()" ${!checked?'disabled':''}>${idx===quiz.length-1?'提交并查看结果':'下一题 →'}</button>${mode==='exam'?'<button class="ghost full" onclick="finishQuiz()">提前交卷</button>':''}`)}else if(page==='result'){let ok=results.filter(x=>x.ok).length;html=card(`<h2>本次练习完成 🎉</h2><div class="stat">本次正确率<strong>${results.length?Math.round(ok/results.length*100):0}%</strong></div><p>答对 ${ok} / ${results.length} 题。${mode==='exam'?'本次仅为示例题模拟。':''}</p><button class="full" onclick="go('practice')">继续刷题</button>`)}else if(page==='plan'){let start=new Date(),target=new Date('2027-05-01T00:00:00');let days=Math.max(0,Math.ceil((target-start)/86400000));html=card(`<h2>学习计划</h2><p>距离 2027 年 5 月 1 日（仅作规划参考）约 <strong>${days}</strong> 天。不是官方考试日期。</p><div class="progress"><div style="width:${state.completed.length/chapters.length*100}%"></div></div><p>知识点进度 ${state.completed.length}/${chapters.length}</p>`)+card(`<h2>零基础学习路径</h2><ul><li>第一阶段：计算机基础、操作系统</li><li>第二阶段：数据结构、算法、数据库</li><li>第三阶段：软件工程、设计方法</li><li>第四阶段：真题训练、案例分析、模拟考试</li></ul><p class="muted">本版为示例章节，后续逐步扩充完整考纲。</p>`)+card(`<h2>每日打卡</h2><p>累计 ${state.checks.length} 天</p><button class="full" onclick="checkin()">${state.checks.includes(date())?'今天已打卡 ✓':'今日打卡'}</button>`)}else if(page==='more'){html=card(`<h2>学习数据统计</h2><div class="grid"><div class="stat">累计刷题<strong>${s.n}</strong></div><div class="stat">正确率<strong>${s.rate}%</strong></div><div class="stat">错题数<strong>${state.wrong.length}</strong></div><div class="stat">已学章节<strong>${state.completed.length}</strong></div></div>`)+card(`<h2>AI 辅导 · 第一版</h2><p class="muted">当前是本地关键词知识助手，不是真实大模型；无需联网或 API 密钥。可以询问“栈”“死锁”“SQL”“CPU”“测试”等。</p><textarea id="ask" placeholder="例如：什么是栈？"></textarea><button class="full" onclick="askTutor()">获取学习解释</button><div id="reply"></div>`)+card(`<h2>数据管理</h2><p class="muted">数据仅存储在当前浏览器中。清理浏览器数据可能丢失记录。</p><button class="secondary full" onclick="exportData()">导出学习数据 JSON</button><button class="ghost full" onclick="resetData()">清空所有学习数据</button>`)}$('app').innerHTML=html;if(page==='quiz'&&mode==='exam'){updateClock();timer=setInterval(updateClock,1000)}}function openLesson(id){chapter=chapters.find(c=>c.id===id);go('lesson')}function completeLesson(){if(!state.completed.includes(chapter.id))state.completed.push(chapter.id);save();startPractice(chapter.id)}function startPractice(id){chapter=chapters.find(c=>c.id===id);startQuiz(chapter.questions.map((q,i)=>({...q,id:id+'-'+i,chapter:chapter.name})),'practice')}function startWrong(){let qs=all.filter(q=>state.wrong.includes(q.id));if(!qs.length){alert('错题本还是空的，先完成章节练习吧。');return}startQuiz(qs,'wrong')}function startExam(){startQuiz([...all].sort(()=>Math.random()-.5),'exam')}function startQuiz(qs,m){quiz=qs;mode=m;idx=0;selected=null;results=[];started=Date.now();go('quiz')}function choose(i){if(selected!==null)return;selected=i;render()}function nextQuestion(){if(selected===null)return;let q=quiz[idx],ok=selected===q.a;results.push({id:q.id,ok,choice:selected});state.answers.push({id:q.id,ok,at:new Date().toISOString(),mode});if(ok)state.wrong=state.wrong.filter(x=>x!==q.id);else if(!state.wrong.includes(q.id))state.wrong.push(q.id);save();idx++;selected=null;if(idx>=quiz.length)finishQuiz();else render()}function finishQuiz(){clearInterval(timer);go('result')}function updateClock(){let left=900-Math.floor((Date.now()-started)/1000);if(left<=0){finishQuiz();return}let el=$('clock');if(el)el.textContent=`剩余 ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} · ${idx+1}/${quiz.length}`}function checkin(){if(!state.checks.includes(date()))state.checks.push(date());save();render()}function askTutor(){let q=$('ask').value.trim();if(!q)return;let match=[['栈','栈是一种后进先出（LIFO）的线性结构。想象一摞盘子：最后放上去的盘子最先拿走。'],['死锁','死锁指多个进程相互等待对方持有的资源。常见必要条件是互斥、请求与保持、不可剥夺、循环等待。'],['sql','SQL 是操作关系数据库的语言。SELECT 查询数据，WHERE 过滤条件，ORDER BY 排序。'],['cpu','CPU 是中央处理器，主要负责执行指令和处理数据。常见组成包括运算器、控制器和寄存器。'],['测试','单元测试针对最小可测试单元，集成测试关注模块之间的交互，系统测试检查整体系统行为。'],['队列','队列是先进先出（FIFO）的线性结构，就像排队买票，先来的人先服务。'],['二分','二分查找要求数据有序。每次比较中间元素并排除一半区间，时间复杂度通常是 O(log n)。']].find(([k])=>q.toLowerCase().includes(k));$('reply').innerHTML=`<div class="note" style="margin-top:12px">${escape(match?match[1]:'本地知识库暂时没有这个问题的答案。试试输入：栈、队列、死锁、CPU、SQL、二分或测试。真实 AI 对话需要后续接入安全的后端服务。')}</div>`}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='软考通-学习数据.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetData(){if(confirm('确定清空所有学习记录？此操作不可撤销。')){localStorage.removeItem(KEY);location.reload()}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
